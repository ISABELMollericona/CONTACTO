<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soluciones digitales</title>
<meta name="description" content="Soluciones digitales con atención directa por WhatsApp.">
<style>
  :root{
    --bg:#05061a; --bg2:#0b0e3a; --azul:#2a2fe0; --cian:#27e0ff; --violeta:#8a4dff; --naranja:#ff8a1f;
    --verde:#25d366; --txt:#e9ecff; --mut:#9aa0d0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;color:var(--txt);background:var(--bg);min-height:100vh;overflow-x:hidden;position:relative}

  /* fondo: rejilla + resplandores */
  body::before{content:"";position:fixed;inset:0;z-index:-2;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(42,47,224,.55), transparent 60%),
      radial-gradient(700px 500px at 100% 10%, rgba(138,77,255,.35), transparent 60%),
      radial-gradient(600px 400px at 50% 110%, rgba(39,224,255,.18), transparent 60%),
      var(--bg);}
  body::after{content:"";position:fixed;inset:0;z-index:-1;
    background-image:linear-gradient(rgba(120,130,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,130,255,.08) 1px,transparent 1px);
    background-size:48px 48px;
    mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 30%,transparent 75%);}

  .wrap{max-width:1000px;margin:0 auto;padding:0 20px}

  /* header */
  header{padding:22px 0;display:flex;justify-content:center;align-items:center}
  .status{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--mut);padding:8px 14px;border:1px solid rgba(120,130,255,.25);border-radius:999px;background:rgba(255,255,255,.03);backdrop-filter:blur(6px)}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--verde);box-shadow:0 0 10px var(--verde);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35;transform:scale(.8)}}

  /* hero */
  .hero{text-align:center;padding:56px 0 40px}
  .tag{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;letter-spacing:.12em;color:var(--cian);border:1px solid rgba(39,224,255,.35);padding:6px 14px;border-radius:6px;background:rgba(39,224,255,.06);margin-bottom:22px}
  h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.1;font-weight:800;letter-spacing:-.02em;max-width:760px;margin:0 auto 18px}
  h1 span{background:linear-gradient(90deg,var(--cian),var(--violeta) 55%,var(--naranja));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{max-width:560px;margin:0 auto 34px;color:var(--mut);font-size:1.1rem;line-height:1.6}
  .cursor{display:inline-block;width:3px;height:1em;background:var(--cian);margin-left:4px;vertical-align:-.12em;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* botón */
  .btn{position:relative;display:inline-flex;align-items:center;gap:12px;color:#04210f;background:var(--verde);text-decoration:none;font-weight:800;font-size:1.15rem;padding:18px 36px;border-radius:14px;transition:transform .2s, box-shadow .2s;
    box-shadow:0 0 0 1px rgba(255,255,255,.15) inset,0 10px 40px rgba(37,211,102,.45)}
  .btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 0 1px rgba(255,255,255,.25) inset,0 16px 60px rgba(37,211,102,.7)}
  .btn svg{width:26px;height:26px;fill:#04210f}
  .btn::after{content:"";position:absolute;inset:-6px;border-radius:18px;border:1px solid rgba(37,211,102,.5);animation:ring 2.2s infinite}
  @keyframes ring{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(1.12)}}
  .sub{margin-top:14px;font-size:.85rem;color:var(--mut)}

  footer{text-align:center;padding:26px 0 90px;color:var(--mut);font-size:.85rem;border-top:1px solid rgba(130,140,255,.15)}

  /* botón flotante */
  .float{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;background:var(--verde);display:grid;place-items:center;box-shadow:0 8px 30px rgba(37,211,102,.6);z-index:10;transition:.2s}
  .float:hover{transform:scale(1.1)}
  .float svg{width:32px;height:32px;fill:#04210f}

  @media(max-width:560px){.status{display:none}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="status"><span class="dot"></span> Atención en línea</div>
  </header>

  <section class="hero">
    <div class="tag">&gt; SOLUCIONES_DIGITALES</div>
    <h1>Tecnología que <span>impulsa tu negocio</span><span class="cursor"></span></h1>
    <p class="lead">Escríbenos por WhatsApp y recibe atención directa, rápida y personalizada. Resolvemos tus dudas en minutos.</p>

    <a class="btn" href="https://wa.me/59172734148?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.5L3 29l6.7-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-3.9-.5-5.6-1.5l-.4-.2-4 1 1.1-3.9-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.7-.9-2.9-1.6-4-3.6-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.6.7.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
      Hablar por WhatsApp
    </a>
    <p class="sub">Respondemos en horario de atención · Sin compromiso</p>
  </section>

  <footer>© <span id="y"></span> Todos los derechos reservados</footer>
</div>

<a class="float" href="https://wa.me/59172734148?text=Hola%2C%20quiero%20m%C3%A1s%20informaci%C3%B3n" target="_blank" rel="noopener" aria-label="WhatsApp">
  <svg viewBox="0 0 32 32"><path d="M16 3C8.8 3 3 8.8 3 16c0 2.3.6 4.5 1.7 6.5L3 29l6.7-1.7A13 13 0 1 0 16 3zm0 23.7c-2 0-3.9-.5-5.6-1.5l-.4-.2-4 1 1.1-3.9-.3-.4A10.7 10.7 0 1 1 16 26.7zm5.9-8c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-1.7-.9-2.9-1.6-4-3.6-.3-.5.3-.5.9-1.6.1-.2 0-.4 0-.5l-1-2.3c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 1.9.8 2.6.9 3.6.7.6-.1 1.9-.8 2.2-1.5.3-.8.3-1.4.2-1.5-.1-.2-.3-.3-.6-.4z"/></svg>
</a>

<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
